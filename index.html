  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 800\">Made for grown-ups<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">Sleeves, storage and grading advice for collectors with a job and a shelf.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PACK OPENER -->\n<section id=\"packs\" style=\"background: #FFCB05\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 40px; display: flex; flex-direction: column; gap: 36px; align-items: center; text-align: center\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 720px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase\">Try it<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">Feel the pull.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55\">Tear open a demo pack and flip each card. Can you find all 21? Odds here are illustrative, not real pull rates.<\u002Fp>\n<\u002Fdiv>\n\n<sc-if value=\"{{ packClosed }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 24px\">\n<div class=\"lift\" style=\"width: 220px; height: 330px; border-radius: 16px; background: #EE1515; border: 6px solid #10163F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 14px 0 rgba(16,22,63,0.35)\">\n<svg width=\"84\" height=\"84\" sc-camel-view-box=\"0 0 36 36\" aria-hidden=\"true\"><circle cx=\"18\" cy=\"18\" r=\"16\" fill=\"#FFFFFF\" stroke=\"#10163F\" stroke-width=\"2\"><\u002Fcircle><path d=\"M2 18a16 16 0 0 1 32 0z\" fill=\"#FFCB05\"><\u002Fpath><rect x=\"2\" y=\"16.5\" width=\"32\" height=\"3\" fill=\"#10163F\"><\u002Frect><circle cx=\"18\" cy=\"18\" r=\"5\" fill=\"#FFFFFF\" stroke=\"#10163F\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-family: 'Bowlby One', sans-serif; font-size: 22px; color: #FFFFFF\">DEMO PACK<\u002Fspan>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ openPack }}\" style=\"background: #10163F; color: #FFCB05; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; padding: 16px 34px; border-radius: 999px; border: 0; cursor: pointer\">Tear it open<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ packOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 28px\">\n<div style=\"display: flex; gap: 18px; justify-content: center; flex-wrap: wrap\">\n<sc-for list=\"{{ packCards }}\" as=\"c\" hint-placeholder-count=\"5\">\n<button sc-camel-on-click=\"{{ c.flip }}\" aria-label=\"{{ c.ariaLabel }}\" style=\"background: none; border: 0; padding: 0; cursor: pointer; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n<sc-if value=\"{{ c.isHidden }}\" hint-placeholder-val=\"{{ true }}\">\n<span class=\"lift\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 190px; height: 266px; border-radius: 14px; background: #141B5C; border: 5px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 10px 22px rgba(16,22,63,0.35)\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 36 36\" aria-hidden=\"true\"><circle cx=\"18\" cy=\"18\" r=\"16\" fill=\"none\" stroke=\"#FFCB05\" stroke-width=\"2.5\"><\u002Fcircle><rect x=\"2\" y=\"16.5\" width=\"32\" height=\"3\" fill=\"#FFCB05\"><\u002Frect><circle cx=\"18\" cy=\"18\" r=\"5\" fill=\"#141B5C\" stroke=\"#FFCB05\" stroke-width=\"2.5\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-weight: 800; font-size: 14px; color: #FFFFFF\">Tap to flip<\u002Fspan>\n<\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{ c.isFlipped }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"{{ c.faceStyle }}\"><img src=\"{{ c.img }}\" alt=\"{{ c.alt }}\" style=\"display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 10px\"><\u002Fspan>\n<\u002Fsc-if>\n<span style=\"font-weight: 800; font-size: 15px; color: #10163F\">{{ c.labelText }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-weight: 800; font-size: 20px; min-height: 30px\">{{ packMessage }}<\u002Fp>\n<p style=\"margin: 0; font-weight: 700; font-size: 16px; color: #3A4070\">{{ collectionText }}<\u002Fp>\n<div style=\"display: flex; gap: 14px; flex-wrap: wrap; justify-content: center\">\n<button sc-camel-on-click=\"{{ revealAll }}\" style=\"background: #10163F; color: #FFCB05; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; padding: 14px 28px; border-radius: 999px; border: 0; cursor: pointer\">Reveal all<\u002Fbutton>\n<button sc-camel-on-click=\"{{ openPack }}\" style=\"background: transparent; color: #10163F; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; padding: 12px 26px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer\">Open another pack<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUIZ -->\n<section id=\"types\" style=\"background: #3B4CCA; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 40px; display: flex; gap: 56px; align-items: center\">\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #FFCB05\">Three questions<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">Which kind of trainer are you?<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55; color: #E4E8FF\">Nostalgic collector, competitor, investor or gift-giver. Answer three quick questions and get a starting point.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #FFFFFF; color: #10163F; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 10px 0 #FFCB05\">\n<sc-if value=\"{{ quizActive }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"height: 10px; border-radius: 999px; background: #E4E8FF; overflow: hidden\">\n<div style=\"{{ progressStyle }}\"><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #3B4CCA\">Question {{ qNum }} of 3<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 26px; line-height: 1.3; font-weight: 800\">{{ currentQuestion }}<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align: left; background: #FFF6DC; color: #10163F; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; padding: 16px 20px; border-radius: 14px; border: 2px solid #10163F; cursor: pointer\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #3B4CCA\">You are<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 34px; line-height: 1.15; font-weight: 400\">{{ result.title }}<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.55\">{{ result.text }}<\u002Fp>\n<div style=\"background: #FFF6DC; border-radius: 14px; padding: 18px 20px; font-size: 17px; line-height: 1.5\"><strong>Start here:<\u002Fstrong> {{ result.tip }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ restartQuiz }}\" style=\"align-self: flex-start; background: #10163F; color: #FFCB05; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; padding: 14px 28px; border-radius: 999px; border: 0; cursor: pointer\">Take it again<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRICES -->\n<section id=\"prices\" style=\"background: #FFF6DC\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 40px; display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 720px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #3B4CCA\">What to expect in India<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">Know the price before you pull.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55\">Pick a product to see the range collectors typically pay.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<sc-for list=\"{{ priceTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background: #141B5C; color: #FFFFFF; border-radius: 24px; padding: 44px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #B9C1F5\">{{ activePrice.label }}<\u002Fspan>\n<span style=\"font-family: 'Bowlby One', sans-serif; font-size: 52px; line-height: 1.1; color: #FFCB05\">{{ activePrice.range }}<\u002Fspan>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55; max-width: 720px; color: #E4E8FF\">{{ activePrice.note }}<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #3A4070\">Indicative ranges from Indian importer listings in 2026. Not a price list; real prices vary by set, seller and condition.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- STORY -->\n<section id=\"story\" style=\"background: #141B5C; color: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 40px; display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 720px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #FFCB05\">Thirty years<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">You were there for all of it.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<sc-for list=\"{{ eras }}\" as=\"e\" hint-placeholder-count=\"6\">\n<button sc-camel-on-click=\"{{ e.pick }}\" style=\"{{ e.style }}\">{{ e.year }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background: #3B4CCA; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 12px; max-width: 820px\">\n<h3 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 30px; line-height: 1.2; font-weight: 400; color: #FFCB05\">{{ activeEra.title }}<\u002Fh3>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.55\">{{ activeEra.text }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- JOIN -->\n<section id=\"join\" style=\"background: #FF7A2F\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 40px; display: flex; gap: 56px; align-items: center\">\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase\">Join the shelf<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">Be first to hear about restocks and meet-ups.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.55\">Tell us your city and we will tell you when new sets land and where local trainers are gathering.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #FFFFFF; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 0 #10163F\">\n<sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<label for=\"email\" style=\"font-weight: 800; font-size: 16px\">Email<\u002Flabel>\n<input id=\"email\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"you@example.com\" style=\"font-family: 'Nunito', sans-serif; font-size: 18px; padding: 14px 16px; border-radius: 12px; border: 2px solid #10163F; background: #FFF6DC; color: #10163F\">\n<label for=\"city\" style=\"font-weight: 800; font-size: 16px\">Your city<\u002Flabel>\n<sc-raw-select id=\"city\" value=\"{{ city }}\" sc-camel-on-change=\"{{ setCity }}\" style=\"font-family: 'Nunito', sans-serif; font-size: 18px; padding: 14px 16px; border-radius: 12px; border: 2px solid #10163F; background: #FFF6DC; color: #10163F\">\n<option value=\"Mumbai\">Mumbai<\u002Foption>\n<option value=\"Bengaluru\">Bengaluru<\u002Foption>\n<option value=\"Delhi-NCR\">Delhi-NCR<\u002Foption>\n<option value=\"Pune\">Pune<\u002Foption>\n<option value=\"Hyderabad\">Hyderabad<\u002Foption>\n<option value=\"Chennai\">Chennai<\u002Foption>\n<option value=\"Another city\">Another city<\u002Foption>\n<\u002Fsc-raw-select>\n<button sc-camel-on-click=\"{{ submitForm }}\" style=\"background: #10163F; color: #FFCB05; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; padding: 16px 30px; border-radius: 999px; border: 0; cursor: pointer\">Notify me<\u002Fbutton>\n<span style=\"font-size: 14px; color: #3A4070\">{{ formHint }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 30px; line-height: 1.2; font-weight: 400\">You are on the list.<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.55\">We will tell {{ city }} trainers first when new sets arrive.<\u002Fp>\n<span style=\"font-size: 14px; color: #3A4070\">Demo only: nothing was sent or stored.<\u002Fspan>\n<button sc-camel-on-click=\"{{ resetForm }}\" style=\"align-self: flex-start; background: transparent; color: #10163F; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; padding: 10px 22px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer\">Sign up another email<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"background: #FFF6DC\">\n<div style=\"max-width: 900px; margin: 0 auto; padding: 88px 40px; display: flex; flex-direction: column; gap: 32px\">\n<h2 style=\"margin: 0; font-family: 'Bowlby One', sans-serif; font-size: 44px; line-height: 1.12; font-weight: 400\">Questions collectors ask.<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"background: #FFFFFF; border-radius: 18px; border: 2px solid #10163F; overflow: hidden\">\n<button sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.expanded }}\" style=\"width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; background: none; border: 0; padding: 20px 24px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 19px; color: #10163F\">\n<span>{{ f.q }}<\u002Fspan>\n<span style=\"font-family: 'Bowlby One', sans-serif; font-size: 24px; color: #3B4CCA\">{{ f.icon }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ f.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 0 24px 22px; font-size: 17px; line-height: 1.6\">{{ f.a }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background: #0D1240; color: #D9DEFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 44px 40px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Bowlby One', sans-serif; font-size: 20px; color: #FFCB05\">The Collector's Shelf<\u002Fspan>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; max-width: 900px\">Academic concept page created for a digital marketing course. Not a real store and not affiliated with or endorsed by The Pokémon Company, Nintendo, Creatures or GAME FREAK. Pokémon, Pikachu, Charizard and all card artwork belong to their respective owners and are used here for classroom purposes only.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  pick(arr) {\n    return arr[Math.floor(Math.random() * arr.length)];\n  }\n\n  makePack() {\n    const CARDS = this.cardPool();\n    const byName = (n) => CARDS.filter((c) => c.name === n)[0];\n    const commons = CARDS.filter((c) => c.tier === 'common');\n    const mids = CARDS.filter((c) => c.tier === 'mid');\n    const doubles = ['Pidgeot ex', 'Blastoise ex'].map(byName);\n    const vs = ['Pikachu V', 'Mew V', 'Empoleon V'].map(byName);\n    const fulls = ['Ho-Oh ex', 'Lugia ex', 'Mewtwo ex'].map(byName);\n    const secrets = ['Gyarados EX', 'Tyranitar ex', 'Mega Lucario ex'].map(byName);\n    const used = {};\n    const take = (arr) => {\n      const free = arr.filter((c) => !used[c.name]);\n      const c = this.pick(free.length ? free : arr);\n      used[c.name] = true;\n      return c;\n    };\n    const cards = [take(commons), take(commons), take(commons.concat(mids))];\n    const r4 = Math.random();\n    cards.push(r4 < 0.55 ? take(mids) : (r4 < 0.85 ? take(mids.concat(commons)) : take(doubles)));\n    const r = Math.random();\n    if (r < 0.30) cards.push(take(doubles));\n    else if (r < 0.56) cards.push(take(vs));\n    else if (r < 0.74) cards.push(take(fulls));\n    else if (r < 0.90) cards.push(take(secrets));\n    else cards.push(byName('Charizard ex'));\n    return cards;\n  }\n\n  cardPool() {\n    const plain = '0 10px 22px rgba(16,22,63,0.3)';\n    const vint = '0 0 0 3px #E0B24A, 0 10px 24px rgba(224,178,74,0.55)';\n    const blue = '0 0 0 4px #7FB8FF, 0 12px 30px rgba(127,184,255,0.7)';\n    const gold = '0 0 0 4px #FFCB05, 0 12px 30px rgba(255,203,5,0.75)';\n    const purp = '0 0 0 4px #B06CFF, 0 12px 30px rgba(176,108,255,0.65)';\n    const fire = '0 0 0 4px #FF7A2F, 0 12px 34px rgba(255,122,47,0.8)';\n    const pink = '0 0 0 4px #FF4FA3, 0 12px 34px rgba(255,79,163,0.75)';\n    return [\n      { name: 'Caterpie', tier: 'common', rarity: 'Common', img: '/_blob/9f2bf30c11fd8a9c81284c0dfda19ca8', glow: plain },\n      { name: 'Zubat', tier: 'common', rarity: 'Common', img: '/_blob/c894546e2c9de24b392407240d68d0ae', glow: plain },\n      { name: 'Togepi', tier: 'common', rarity: 'Common', img: '/_blob/f0ff0e132c3a783f057e8bdc12c77ee3', glow: plain },\n      { name: 'Eevee', tier: 'common', rarity: 'Common', img: '/_blob/fa8cf56e34a3029e76d68b0811558bb3', glow: plain },\n      { name: 'Sceptile', tier: 'common', rarity: 'Common', img: '/_blob/4c1237e7b50a5684f6ae4550fc96e2be', glow: plain },\n      { name: 'Golduck', tier: 'mid', rarity: 'Rare', img: '/_blob/d03821f596f41dd422030663d62d6373', glow: plain },\n      { name: 'Snorlax', tier: 'mid', rarity: 'Holo', img: '/_blob/e69ed3c043951e18dd3840d69dc131b7', glow: plain },\n      { name: 'Raichu', tier: 'mid', rarity: 'Vintage', img: '/_blob/f4676772e793292344b371eab137e31a', glow: vint },\n      { name: 'Machamp', tier: 'mid', rarity: '1st Edition Holo', img: '/_blob/7d775a85947834854d9f3466865aee0d', glow: vint },\n      { name: 'Pidgeot ex', tier: 'hit', rarity: 'Double Rare', img: '/_blob/b01a353e7f938b134c1d1f6e32a6c9b9', glow: blue },\n      { name: 'Blastoise ex', tier: 'hit', rarity: 'Double Rare', img: '/_blob/d4cfcb0f687d476291a0ea10cfe7043b', glow: blue },\n      { name: 'Pikachu V', tier: 'hit', rarity: 'Holo V', img: '/_blob/ef1e540196977a27d1751f3d67c621a8', glow: gold },\n      { name: 'Mew V', tier: 'hit', rarity: 'Holo V', img: '/_blob/2139aaa6cba55980406486519ff89f43', glow: purp },\n      { name: 'Empoleon V', tier: 'hit', rarity: 'Full Art V', img: '/_blob/b8f1cd3c85de8ebff84fc7a3ff41e7b9', glow: blue },\n      { name: 'Ho-Oh ex', tier: 'hit', rarity: 'Full Art', img: '/_blob/c064d673ffd64452bb150185944b1341', glow: gold },\n      { name: 'Lugia ex', tier: 'hit', rarity: 'Full Art', img: '/_blob/913f3dce174d1be4ff7342ec9ed9a655', glow: gold },\n      { name: 'Mewtwo ex', tier: 'hit', rarity: 'Full Art', img: '/_blob/e9538ca3a242e24b57ca0c2c2204651d', glow: purp },\n      { name: 'Gyarados EX', tier: 'hit', rarity: 'Secret Rare', img: '/_blob/0b5d9bf4a94cfa01a9a379c9aac1382e', glow: pink },\n      { name: 'Tyranitar ex', tier: 'hit', rarity: 'Secret Rare', img: '/_blob/8607875b639afaff8a1d0a24bcddf4cd', glow: pink },\n      { name: 'Mega Lucario ex', tier: 'hit', rarity: 'Secret Rare', img: '/_blob/cac47bc4d5d474a6301cc99c710da39a', glow: pink },\n      { name: 'Charizard ex', tier: 'hit', rarity: 'Double Rare', img: '/_blob/a94dc3d77774088e8b2f75ef3c9563b4', glow: fire }\n    ];\n  }\n\n  renderVals() {\n    const D = {\n      wishP: false, wishC: false,\n      packOpen: false, pack: [], flipped: [false, false, false, false, false], seen: {},\n      quizStep: 0, scores: { n: 0, c: 0, i: 0, g: 0 },\n      priceTab: 0, era: 0, faq: 0,\n      email: '', city: 'Mumbai', submitted: false, emailError: false\n    };\n    const s = Object.assign({}, D, this.state || {});\n\n    // ---------- wishlist ----------\n    const wishOn = 'align-self: flex-start; background: #10163F; color: #FFCB05; font-family: Nunito, sans-serif; font-weight: 800; font-size: 16px; padding: 12px 22px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer';\n    const wishOff = 'align-self: flex-start; background: transparent; color: #10163F; font-family: Nunito, sans-serif; font-weight: 800; font-size: 16px; padding: 12px 22px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer';\n    const wishCount = (s.wishP ? 1 : 0) + (s.wishC ? 1 : 0);\n    const wishText = wishCount === 0 ? 'Your wishlist is empty. Tap a button above to start it.' : (wishCount === 1 ? 'One card on your wishlist. One more to complete the pair.' : 'Both icons are on your wishlist. Time to open a pack.');\n\n    // ---------- pack opener ----------\n    const total = s.pack.length;\n    const flippedCount = s.flipped.filter((x) => x).length;\n    const allRevealed = total > 0 && flippedCount === total;\n    const names = s.pack.map((c) => c.name);\n    let packMessage = 'Tap each card to flip it.';\n    if (allRevealed) {\n      const has = (n) => names.indexOf(n) >= 0;\n      const anyRar = (r) => s.pack.some((c) => c.rarity === r);\n      if (has('Charizard ex')) packMessage = 'A Charizard ex pull. The card collectors dream about.';\n      else if (anyRar('Secret Rare')) packMessage = 'A Secret Rare. This is the pull collectors chase.';\n      else if (anyRar('Full Art')) packMessage = 'A gold Full Art. That shine is why people collect.';\n      else if (has('Pikachu V')) packMessage = 'A holo Pikachu V. A very good day.';\n      else if (has('Mew V') || has('Empoleon V')) packMessage = 'A holo V pull. Not bad at all.';\n      else if (has('Pidgeot ex') || has('Blastoise ex')) packMessage = 'A Double Rare ex. A solid pull.';\n      else if (has('Machamp')) packMessage = 'A 1st Edition Machamp. Straight out of the original era.';\n      else packMessage = 'No hit this time. Every pack is a fresh roll.';\n    }\n    const seenMap = s.seen || {};\n    const total19 = this.cardPool().length;\n    const seenCount = Object.keys(seenMap).length;\n    const collectionText = 'Collection: ' + seenCount + ' of ' + total19 + ' cards discovered.';\n    const packCards = s.pack.map((c, i) => ({\n      name: c.name,\n      rarity: c.rarity,\n      img: c.img,\n      alt: c.name + ' trading card',\n      idx: i + 1,\n      isFlipped: !!s.flipped[i],\n      isHidden: !s.flipped[i],\n      labelText: s.flipped[i] ? c.name + ' · ' + c.rarity : 'Mystery card',\n      ariaLabel: s.flipped[i] ? 'Card ' + (i + 1) + ': ' + c.name + ', ' + c.rarity : 'Flip card ' + (i + 1),\n      faceStyle: 'display: block; width: 190px; height: 266px; border-radius: 12px; box-sizing: border-box; box-shadow: ' + c.glow,\n      flip: () => {\n        const f = (this.state && this.state.flipped ? this.state.flipped : D.flipped).slice();\n        f[i] = true;\n        const sn = Object.assign({}, (this.state && this.state.seen) || {});\n        sn[c.name] = true;\n        this.setState({ flipped: f, seen: sn });\n      }\n    }));\n\n    // ---------- quiz ----------\n    const QS = [\n      { q: 'What brings you back to Pokémon cards?', opts: [\n        ['Nostalgia. I want my childhood binder back.', 'n'],\n        ['The game. I want to battle my friends.', 'c'],\n        ['The value. Rare cards can appreciate.', 'i'],\n        ['Someone I am buying for.', 'g'] ] },\n      { q: 'Which first purchase sounds best?', opts: [\n        ['A display-worthy Charizard.', 'n'],\n        ['A set of playable cards for a deck.', 'c'],\n        ['A sealed box to hold or grade.', 'i'],\n        ['A gift-ready box for a birthday.', 'g'] ] },\n      { q: 'Where do you spend time online?', opts: [\n        ['Instagram and YouTube unboxings.', 'n'],\n        ['Discord and WhatsApp meet-up groups.', 'c'],\n        ['Price trackers and resale groups.', 'i'],\n        ['Family group chats.', 'g'] ] }\n    ];\n    const RESULTS = {\n      n: { title: 'The Nostalgic Collector', text: 'You are here for the characters you grew up with. Art, rarity and the story behind each card matter most to you.', tip: 'Pick a sealed box from a set featuring your childhood favourites, then hunt one Pikachu or Charizard for the centre of your shelf.' },\n      c: { title: 'The Competitor', text: 'You want the game. Decks, matchups and meet-ups matter more to you than rarity.', tip: 'Build around playable cards, buy singles for the deck you want and find a local meet-up group.' },\n      i: { title: 'The Investor', text: 'You watch prices and condition. Sealed product and graded cards are your language.', tip: 'Buy sealed, store carefully and learn how grading works before you spend big.' },\n      g: { title: 'The Gift-Giver', text: 'You are buying for someone you care about. You want something safe, easy and delightful.', tip: 'Choose a sealed box or a beginner-friendly bundle and check the seller returns policy.' }\n    };\n    const step = s.quizStep;\n    const quizDone = step >= 3;\n    const q = QS[Math.min(step, 2)];\n    const options = q.opts.map((o) => ({\n      label: o[0],\n      pick: () => {\n        const st = this.state || {};\n        const sc = Object.assign({ n: 0, c: 0, i: 0, g: 0 }, st.scores || {});\n        sc[o[1]] += 1;\n        this.setState({ scores: sc, quizStep: (st.quizStep || 0) + 1 });\n      }\n    }));\n    let best = 'n';\n    ['n', 'c', 'i', 'g'].forEach((k) => { if (s.scores[k] > s.scores[best]) best = k; });\n    const progressStyle = 'height: 100%; background: #FF7A2F; border-radius: 999px; width: ' + Math.round((Math.min(step, 3) / 3) * 100) + '%';\n\n    // ---------- prices ----------\n    const PRICES = [\n      { label: 'Booster pack', range: '₹850 to ₹2,000', note: 'One sealed pack. The easiest way to feel the pull and the cheapest way in.' },\n      { label: 'Elite Trainer Box', range: '₹12,000 to ₹25,000+', note: 'A sealed box with packs and accessories. Ranges vary by set and seller.' },\n      { label: 'Single cards', range: 'A few hundred ₹ and up', note: 'Prices climb with rarity and condition, from bargain-bin cards to rare pieces that reach several lakh rupees.' },\n      { label: 'Graded cards', range: 'Priced per card and grade', note: 'Cards graded by companies such as PSA or CGC carry a premium. Ask the seller for a quote.' }\n    ];\n    const tabOn = 'background: #10163F; color: #FFCB05; font-family: Nunito, sans-serif; font-weight: 800; font-size: 17px; padding: 12px 24px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer';\n    const tabOff = 'background: #FFFFFF; color: #10163F; font-family: Nunito, sans-serif; font-weight: 800; font-size: 17px; padding: 12px 24px; border-radius: 999px; border: 2px solid #10163F; cursor: pointer';\n    const priceTabs = PRICES.map((p, i) => ({\n      label: p.label,\n      style: i === s.priceTab ? tabOn : tabOff,\n      pick: () => this.setState({ priceTab: i })\n    }));\n\n    // ---------- story ----------\n    const ERAS = [\n      { year: '1996', title: 'The card game arrives', text: 'The Pokémon Trading Card Game debuts in Japan and the first holo cards begin to circulate.' },\n      { year: '1997', title: 'The anime begins', text: 'The TV series starts in Japan and gives every card a face and a story.' },\n      { year: 'Early 2000s', title: 'Pokémon reaches Indian screens', text: 'A generation of Indian kids meets Ash, Pikachu and Charizard on television.' },\n      { year: '2016', title: 'Pokémon GO', text: 'Trainers take to the streets and lapsed fans start remembering their old binders.' },\n      { year: '2024', title: 'TCG Pocket', text: 'The card game arrives on phones and reaches a brand new audience.' },\n      { year: '2026', title: 'Thirty years of Pokémon', text: 'The anniversary year brings special releases and a fresh reason to open your old binder.' }\n    ];\n    const eraOn = 'background: #FFCB05; color: #10163F; font-family: Nunito, sans-serif; font-weight: 800; font-size: 17px; padding: 12px 22px; border-radius: 999px; border: 2px solid #FFCB05; cursor: pointer';\n    const eraOff = 'background: transparent; color: #FFFFFF; font-family: Nunito, sans-serif; font-weight: 800; font-size: 17px; padding: 12px 22px; border-radius: 999px; border: 2px solid #FFFFFF; cursor: pointer';\n    const eras = ERAS.map((e, i) => ({\n      year: e.year,\n      style: i === s.era ? eraOn : eraOff,\n      pick: () => this.setState({ era: i })\n    }));\n\n    // ---------- faq ----------\n    const FAQS = [\n      { q: 'Are the cards authentic?', a: 'This concept page promises authentic cards only: sealed, traceable product with clear photos before you pay. Whoever you buy from, ask for sealed proof and a returns policy.' },\n      { q: 'Why do prices in India look higher?', a: 'There is no official Pokémon Company distributor in India, so cards are imported by specialty stores. Shipping and import costs add to the shelf price.' },\n      { q: 'Which set should I start with?', a: 'Start with a set that features the characters you grew up with, either a sealed box or a few booster packs. The anniversary year has special releases worth a look.' },\n      { q: 'Can I trade or play with friends?', a: 'Yes. Cards work for collecting, trading and playing. Meet-up groups on Discord and WhatsApp exist in the bigger cities.' }\n    ];\n    const faqs = FAQS.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      isOpen: s.faq === i,\n      expanded: s.faq === i ? 'true' : 'false',\n      icon: s.faq === i ? '–' : '+',\n      toggle: () => this.setState({ faq: (this.state && this.state.faq === i) ? -1 : i })\n    }));\n\n    return {\n      // wishlist\n      pikachuBtnStyle: s.wishP ? wishOn : wishOff,\n      pikachuBtnLabel: s.wishP ? 'On your wishlist' : 'Add to wishlist',\n      charizardBtnStyle: s.wishC ? wishOn : wishOff,\n      charizardBtnLabel: s.wishC ? 'On your wishlist' : 'Add to wishlist',\n      wishText: wishText,\n      togglePikachu: () => this.setState({ wishP: !(this.state && this.state.wishP) }),\n      toggleCharizard: () => this.setState({ wishC: !(this.state && this.state.wishC) }),\n      // pack\n      packOpen: s.packOpen,\n      packClosed: !s.packOpen,\n      packCards: packCards,\n      packMessage: packMessage,\n      collectionText: collectionText,\n      openPack: () => this.setState({ packOpen: true, pack: this.makePack(), flipped: [false, false, false, false, false] }),\n      revealAll: () => {\n        const sn = Object.assign({}, (this.state && this.state.seen) || {});\n        ((this.state && this.state.pack) || []).forEach((c) => { sn[c.name] = true; });\n        this.setState({ flipped: [true, true, true, true, true], seen: sn });\n      },\n      // quiz\n      quizActive: !quizDone,\n      quizDone: quizDone,\n      qNum: Math.min(step, 2) + 1,\n      currentQuestion: q.q,\n      options: options,\n      progressStyle: progressStyle,\n      result: RESULTS[best],\n      restartQuiz: () => this.setState({ quizStep: 0, scores: { n: 0, c: 0, i: 0, g: 0 } }),\n      // prices\n      priceTabs: priceTabs,\n      activePrice: PRICES[s.priceTab],\n      // story\n      eras: eras,\n      activeEra: ERAS[s.era],\n      // faq\n      faqs: faqs,\n      // join form\n      formOpen: !s.submitted,\n      submitted: s.submitted,\n      email: s.email,\n      city: s.city,\n      formHint: s.emailError ? 'Please enter a valid email address.' : 'Demo only: nothing is sent or stored.',\n      setEmail: (e) => this.setState({ email: e.target.value, emailError: false }),\n      setCity: (e) => this.setState({ city: e.target.value }),\n      submitForm: () => {\n        const em = (this.state && this.state.email) || '';\n        if (em.indexOf('@') > 0 && em.indexOf('.') > em.indexOf('@')) this.setState({ submitted: true, emailError: false });\n        else this.setState({ emailError: true });\n      },\n      resetForm: () => this.setState({ submitted: false, email: '' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
